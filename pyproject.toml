[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litedvr"
version = "0.1.0"
description = "Low-resource RTSP packet-copy DVR"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9,<4", "aiosqlite>=0.19,<1"]

[project.scripts]
litedvr = "litedvr.main:main"

[tool.setuptools.packages.find]
include = ["litedvr*"]
