services:
  litedvr:
    build: .
    image: ${LITEDVR_IMAGE:-pranavdarshan1/litedvr:latest}
    platform: ${LITEDVR_PLATFORM:-linux/386}
    container_name: litedvr
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      LITEDVR_BIND_ADDRESS: "0.0.0.0"
      LITEDVR_PORT: "8080"
      LITEDVR_DATABASE_PATH: "/var/lib/litedvr/litedvr.sqlite3"
      LITEDVR_RECORDINGS_PATH: "/var/lib/litedvr/recordings"
      LITEDVR_DEFAULT_SEGMENT_MINUTES: "180"
      LITEDVR_ALLOWED_ORIGINS: "http://localhost:8081,http://127.0.0.1:8081,http://192.168.*"
    volumes:
      # Keep the Docker runtime on the same database and recordings used by
      # the local test setup. This prevents the named volume from appearing
      # empty when the project already has cameras configured.
      - ${LITEDVR_DATA_DIR:-./.local-data}:/var/lib/litedvr
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  frontend:
    build: ./frontend
    image: ${LITEDVR_FRONTEND_IMAGE:-pranavdarshan1/litedvr-frontend:latest}
    platform: ${LITEDVR_PLATFORM:-linux/386}
    container_name: litedvr-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      litedvr:
        condition: service_healthy
